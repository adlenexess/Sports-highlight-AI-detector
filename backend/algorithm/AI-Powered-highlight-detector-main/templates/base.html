<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Automatic Sports Highlight Generator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">🏆 Highlight<span>AI</span></div>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('history') }}">History</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>B.Tech Project &mdash; Automatic Highlight Detector &mdash; Multi-Sport AI Pipeline</p>
    </footer>
</body>
</html>
